services:

  kafka:
    image: apache/kafka:3.8.1
    container_name: commerce-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  minio:
    image: minio/minio:latest
    container_name: commerce-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: quay.io/minio/mc
    container_name: commerce-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio123; do sleep 2; done;
      mc mb --ignore-existing local/commerce-data;
      exit 0
      "
  spark:
    image: apache/spark:3.5.6
    container_name: commerce-spark
    hostname: spark
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./streaming:/opt/spark-apps
      - ivy_cache:/tmp/.ivy2
      - ./secrets/snowflake_key.p8:/opt/spark-apps/secrets/snowflake_key.p8:ro
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      SPARK_NO_DAEMONIZE: "true"
      SNOWFLAKE_ACCOUNT: SXNHUJV-WF96491
      SNOWFLAKE_USER: GIGAOPS
      SNOWFLAKE_WAREHOUSE: EVENTDRIVEN_PIPELINE_WH
      SNOWFLAKE_DATABASE: EVENTDRIVEN_PIPELINE_DB
      SNOWFLAKE_SCHEMA: RAW
 
  spark-worker:
    image: apache/spark:3.5.6
    container_name: commerce-spark-worker
    hostname: spark-worker
    depends_on:
      - spark
    environment:
      SPARK_NO_DAEMONIZE: "true"
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      --cores 2
      --memory 1G
      spark://spark:7077
    volumes:
      - ./streaming:/opt/spark-apps

volumes:
  minio_data:
  ivy_cache:
